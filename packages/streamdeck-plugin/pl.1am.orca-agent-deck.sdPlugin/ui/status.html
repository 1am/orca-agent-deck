<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Setup</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 8px;
        font:
          11px system-ui,
          sans-serif;
        color: #d8d8d8;
        background: #2d2d2d;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 12px;
      }
      .check {
        padding: 6px 0;
        border-top: 1px solid #444;
      }
      .head {
        display: flex;
        gap: 6px;
        font-weight: 600;
      }
      .mark {
        flex: none;
        width: 12px;
        height: 16px;
        display: flex;
        align-items: center;
      }
      .mark svg {
        width: 12px;
        height: 12px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ok .mark {
        color: #5fbf6a;
      }
      .warn .mark {
        color: #e0b030;
      }
      .fail .mark {
        color: #e05a50;
      }
      .reason,
      .hint {
        margin: 2px 0 0 18px;
        color: #9a9a9a;
      }
      #checks.busy {
        opacity: 0.5;
      }
      #stamp {
        margin-top: 8px;
        color: #9a9a9a;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      button {
        margin-top: 10px;
        width: 100%;
        font: inherit;
        color: inherit;
        background: #3a3a3a;
        border: 1px solid #555;
        border-radius: 3px;
        padding: 5px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Setup</h1>
    <div id="checks">Checking...</div>
    <div id="stamp" role="status"></div>
    <button id="recheck">Check again</button>
    <script src="pi.js"></script>
    <script>
      // Drawn, not typed: a font glyph reads as the letter "v" on some hosts.
      const MARK = {
        ok: { label: 'OK', path: 'M2.5 6.5l3 3 5-6' },
        warn: { label: 'Warning', path: 'M6 1.2l5.3 9.3H.7zM6 4.6v2.8M6 8.9h.01' },
        fail: { label: 'Failed', path: 'M2.5 2.5l7 7M9.5 2.5l-7 7' },
      };
      const SVG = 'http://www.w3.org/2000/svg';
      function markEl(result) {
        const m = MARK[result] || MARK.fail;
        const svg = document.createElementNS(SVG, 'svg');
        svg.setAttribute('viewBox', '0 0 12 12');
        svg.setAttribute('role', 'img');
        svg.setAttribute('aria-label', m.label);
        const p = document.createElementNS(SVG, 'path');
        p.setAttribute('d', m.path);
        svg.appendChild(p);
        return svg;
      }
      function render(checks) {
        const root = document.getElementById('checks');
        root.textContent = '';
        for (const c of checks) {
          const el = document.createElement('div');
          el.className = 'check ' + c.result;
          const add = (cls, text, parent = el) => {
            const d = document.createElement('div');
            d.className = cls;
            d.textContent = text;
            parent.appendChild(d);
            return d;
          };
          const head = add('head', '');
          add('mark', '', head).appendChild(markEl(c.result));
          add('', c.label, head);
          add('reason', c.reason);
          if (c.result !== 'ok' && c.hint) add('hint', 'Fix: ' + c.hint);
          root.appendChild(el);
        }
      }

      const recheck = document.getElementById('recheck');
      const stamp = document.getElementById('stamp');
      let waiting = null;

      function settle(text) {
        clearTimeout(waiting);
        waiting = null;
        recheck.disabled = false;
        recheck.textContent = 'Check again';
        document.getElementById('checks').classList.remove('busy');
        stamp.textContent = text;
      }

      // A re-check that changes nothing must still be visibly done.
      recheck.onclick = () => {
        recheck.disabled = true;
        recheck.textContent = 'Checking...';
        document.getElementById('checks').classList.add('busy');
        stamp.textContent = '';
        clearTimeout(waiting);
        waiting = setTimeout(() => settle('No answer from the plugin'), 5000);
        send({ type: 'load' });
      };

      const send = connectPi('checks', (m) => {
        render(m.checks);
        settle('Checked at ' + new Date().toLocaleTimeString());
      });
    </script>
  </body>
</html>
