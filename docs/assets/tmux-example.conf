# Reference tmux.conf for running agents under Orca with Agent Deck for Orca.
# Copy the lines you need into ~/.tmux.conf, then start a fresh server (tmux kill-server).
# Why each line exists: docs/working-with-tmux.md

# Pass Orca's variables from the attaching client into the session, so the agent's hooks
# report to the right Orca pane and the deck shows one key per pane (stablyai/orca#32293, #37799).
# Use one tmux session per Orca pane: `tmux new -A -s <name>`.
# SSH hosts need this file too: tmux there starts from Orca's remote shell, not from this machine.
# Codex: also run `codex --no-daemon`, or its shared daemon reports to one pane (docs/known-issues.md).

# How a hook reaches Orca: port, token, endpoint file, hook script root and protocol.
set -ga update-environment "ORCA_AGENT_HOOK_PORT ORCA_AGENT_HOOK_TOKEN ORCA_AGENT_HOOK_ENDPOINT ORCA_AGENT_HOOK_ROOT ORCA_AGENT_HOOK_ENV ORCA_AGENT_HOOK_VERSION ORCA_AGENT_HOOK_TRANSPORT"
# Which pane a hook reports for. These differ per Orca pane.
set -ga update-environment "ORCA_PANE_KEY ORCA_AGENT_PANE ORCA_TAB_ID ORCA_TERMINAL_HANDLE ORCA_WORKTREE_ID ORCA_WORKSPACE_ID ORCA_AGENT_LAUNCH ORCA_AGENT_LAUNCH_TOKEN"

# Let modified keys (Shift+Enter, Ctrl+Enter and so on) reach the agent inside tmux. Needs tmux 3.2+.
set -g extended-keys on
